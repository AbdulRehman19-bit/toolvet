name: toolvet
description: Audit MCP server configurations for dangerous tool combinations and drift from agent.lock.
author: AbdulRehman
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Repository path to scan.
    default: "."
  fail-on:
    description: Fail if a finding is at least this severe (info, low, medium, high, critical).
    default: high
  verify:
    description: Also run `toolvet verify` when agent.lock exists.
    default: "true"
  sarif-file:
    description: Where to write the SARIF report.
    default: toolvet.sarif
  classify:
    description: Also score tool descriptions with the local ML classifier (advisory, never fails the build).
    default: "false"
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write).
    default: "false"
  diff:
    description: On pull requests, compare MCP configs with the base and report what changed in capabilities.
    default: "true"
  diff-policy:
    description: Which agent.policy.toml suppresses findings in the diff - base (a change cannot waive its own risk), head, or none.
    default: base
  comment:
    description: Post the diff as one pull request comment, updated in place (needs pull-requests write; the job summary is always written).
    default: "true"

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install toolvet
      shell: bash
      env:
        CLASSIFY: ${{ inputs.classify }}
      run: |
        if [ "$CLASSIFY" = "true" ]; then
          python -m pip install --quiet "${{ github.action_path }}[ml]"
        else
          python -m pip install --quiet "${{ github.action_path }}"
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        CLASSIFY: ${{ inputs.classify }}
      run: |
        set +e
        extra=""
        [ "$CLASSIFY" = "true" ] && extra="--classify"
        toolvet scan "${{ inputs.path }}" --no-user $extra --format sarif \
          --output "${{ inputs.sarif-file }}" --fail-on "${{ inputs.fail-on }}"
        echo "code=$?" >> "$GITHUB_OUTPUT"
        toolvet scan "${{ inputs.path }}" --no-user $extra --fail-on "${{ inputs.fail-on }}" || true

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Verify lockfile
      id: verify
      if: always() && inputs.verify == 'true'
      shell: bash
      run: |
        set +e
        if [ -f "${{ inputs.path }}/agent.lock" ]; then
          toolvet verify "${{ inputs.path }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
        else
          echo "No agent.lock found; skipping verify."
          echo "code=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Diff against the pull request base
      id: diff
      if: always() && inputs.diff == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        DIFF_POLICY: ${{ inputs.diff-policy }}
      run: |
        set +e
        git -C "$INPUT_PATH" fetch --no-tags --depth=1 origin "$BASE_SHA"
        toolvet diff "$INPUT_PATH" --base "$BASE_SHA" --format markdown \
          --output toolvet-diff.md --fail-on "$FAIL_ON" --policy "$DIFF_POLICY"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ -f toolvet-diff.md ]; then
          cat toolvet-diff.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "toolvet diff could not run (exit $code); see the log above." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on the pull request
      if: always() && steps.diff.outcome != 'skipped' && inputs.comment == 'true'
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('toolvet-diff.md')) return;
          const body = fs.readFileSync('toolvet-diff.md', 'utf8');
          const marker = '<!-- toolvet-diff -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number,
          });
          const existing = comments.find(
            (c) => c.user && c.user.type === 'Bot' && c.body && c.body.startsWith(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else if (!body.includes('No capability changes')) {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on findings or drift
      if: always()
      shell: bash
      env:
        SCAN_CODE: ${{ steps.scan.outputs.code }}
        VERIFY_CODE: ${{ steps.verify.outputs.code }}
        DIFF_CODE: ${{ steps.diff.outputs.code }}
      run: |
        fail=0
        [ "${SCAN_CODE:-1}" != "0" ] && fail=1
        [ "${VERIFY_CODE:-0}" != "0" ] && fail=1
        [ "${DIFF_CODE:-0}" != "0" ] && fail=1
        if [ "$fail" = "1" ]; then
          echo "toolvet failed: scan exit ${SCAN_CODE:-unknown}, verify exit ${VERIFY_CODE:-skipped}, diff exit ${DIFF_CODE:-skipped}"
          exit 1
        fi

[project]
name = "agentaudit"
version = "0.2.0"
description = "Find dangerous combinations of AI agent tools before attackers do, and pin what was approved."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "networkx>=3.2",
]

[project.scripts]
agentaudit = "agentaudit.cli:app"

[project.entry-points."agentaudit.rules"]
# Third-party packages register rules in this group; built-ins load directly.

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentaudit --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

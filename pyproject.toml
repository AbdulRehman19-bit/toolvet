[project]
name = "agentaudit"
version = "0.6.3"
description = "Find dangerous combinations of AI agent tools before attackers do, and pin what was approved."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AbdulRehman" }]
keywords = ["mcp", "model-context-protocol", "security", "audit", "ai-agents", "llm",
            "prompt-injection", "sarif", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "networkx>=3.2",
]

[project.urls]
Homepage = "https://github.com/AbdulRehman19-bit/agentaudit"
Repository = "https://github.com/AbdulRehman19-bit/agentaudit"
Issues = "https://github.com/AbdulRehman19-bit/agentaudit/issues"
Changelog = "https://github.com/AbdulRehman19-bit/agentaudit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/AbdulRehman19-bit/agentaudit/tree/main/docs"

[project.scripts]
agentaudit = "agentaudit.cli:app"

[project.optional-dependencies]
ml = ["onnxruntime>=1.17", "numpy>=1.26"]

[project.entry-points."agentaudit.rules"]
# Third-party packages register rules in this group; built-ins load directly.

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentaudit --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"training/*" = ["ISC004"]
